{{ define "organization-fields" }}
  <div
    class="flex flex-col gap-2 text-sm"
    data-label-picker="room"
  >
    <label for="device-room">Room</label>
    <div
      class="input group/room w-full gap-2 data-[colored-label]:text-(--label-color)
        data-[colored-label]:[--input-color:var(--label-color)]"
      data-picker-field
    >
      <span
        class="hidden size-2 shrink-0 rounded-full bg-(--label-color)
          group-data-[colored-label]/room:block"
        aria-hidden="true"
      ></span>
      <input
        id="device-room"
        class="min-w-0 grow [@media(pointer:coarse)]:text-base"
        name="room"
        value="{{ .Device.Room }}"
        maxlength="100"
        autocomplete="off"
        placeholder="Choose or add a room…"
        data-picker-input
      />
      <button
        type="button"
        class="btn btn-ghost btn-square btn-xs shrink-0 text-base-content/60
          [@media(pointer:coarse)]:size-8"
        aria-label="Clear room"
        data-picker-clear
        hidden
      >
        <svg
          class="icon"
          aria-hidden="true"
        >
          <use href="#icon-close"></use>
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-square btn-xs shrink-0 text-base-content/60
          [@media(pointer:coarse)]:size-8"
        aria-label="Room suggestions"
        aria-controls="room-suggestions"
        aria-expanded="false"
        data-picker-toggle
      >
        <svg
          class="icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
    </div>
    <div
      id="room-suggestions"
      class="card fixed z-[110] overflow-y-auto overscroll-contain border border-base-content/20
        bg-base-300 p-1 shadow-xl"
      role="listbox"
      aria-label="Rooms"
      data-picker-menu
      hidden
    ></div>
    <select
      data-picker-source
      hidden
      disabled
    >
      {{ range .Rooms }}<option>{{ . }}</option>{{ end }}
    </select>
  </div>
  <div
    class="flex flex-col gap-2 text-sm"
    data-label-picker="tags"
  >
    <label for="device-tags">Tags</label>
    <div
      class="flex flex-wrap gap-1.5"
      data-tag-chips
      hidden
    ></div>
    <div
      class="input w-full gap-2"
      data-picker-field
    >
      <input
        id="device-tags"
        class="min-w-0 grow [@media(pointer:coarse)]:text-base"
        name="tags"
        value="{{ .Device.TagsText }}"
        maxlength="500"
        autocomplete="off"
        placeholder="Find or add a tag…"
        data-picker-input
      />
      <button
        type="button"
        class="btn btn-ghost btn-square btn-xs shrink-0 text-base-content/60
          [@media(pointer:coarse)]:size-8"
        aria-label="Tag suggestions"
        aria-controls="tag-suggestions"
        aria-expanded="false"
        data-picker-toggle
      >
        <svg
          class="icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
    </div>
    <div
      id="tag-suggestions"
      class="card fixed z-[110] overflow-y-auto overscroll-contain border border-base-content/20
        bg-base-300 p-1 shadow-xl"
      role="listbox"
      aria-label="Tags"
      data-picker-menu
      hidden
    ></div>
    <select
      data-picker-source
      hidden
      disabled
    >
      {{ range .Tags }}<option>{{ . }}</option>{{ end }}
    </select>
    <p
      class="sr-only"
      data-picker-status
      role="status"
    ></p>
  </div>
{{ end }}

{{ define "organization-editor" }}
  <form
    action="/devices/{{ .Device.ID }}/organization"
    method="post"
    hx-post="/devices/{{ .Device.ID }}/organization"
    hx-target="#inventory"
    hx-swap="innerHTML"
    hx-disabled-elt="find fieldset"
    data-organization-form
  >
    <input
      type="hidden"
      name="csrf"
      value="{{ .CSRF }}"
    />
    <fieldset>
      <div
        class="flex items-start justify-between gap-4 border-b border-base-content/10 px-6 pt-6
          pb-5"
      >
        <div class="min-w-0">
          <h2
            id="organization-title"
            class="text-lg font-semibold"
          >
            Room & tags
          </h2>
          <p class="mt-1.5 text-xs text-base-content/60 wrap-anywhere">{{ .Name }}</p>
        </div>
        <button
          type="button"
          class="btn btn-ghost btn-square btn-sm text-base-content/60"
          aria-label="Close editor"
          data-organization-close
        >
          <svg
            class="icon"
            aria-hidden="true"
          >
            <use href="#icon-close"></use>
          </svg>
        </button>
      </div>
      <div class="grid gap-5 p-6">{{ template "organization-fields" . }}</div>
      <p
        class="alert alert-error mx-6 mb-5 w-auto py-3 text-sm"
        role="alert"
        data-organization-error
        hidden
      ></p>
      <div class="flex justify-end gap-2 border-t border-base-content/10 px-6 py-4">
        <button
          type="button"
          class="btn btn-ghost"
          data-organization-close
        >
          Cancel
        </button>
        <button
          type="submit"
          class="btn btn-primary"
        >
          Save
          <span
            class="loading loading-spinner loading-xs hidden in-[.htmx-request]:inline-block"
            aria-hidden="true"
          ></span>
        </button>
      </div>
    </fieldset>
  </form>
{{ end }}

{{ define "organization-saved" }}
  {{ template "inventory-updated" . }}
  <select
    id="room"
    hx-swap-oob="innerHTML"
  >
    {{ template "room-options" . }}
  </select>
{{ end }}

{{ define "organization-dialog" }}
  <dialog
    id="organization-dialog"
    class="modal motion-reduce:transition-none"
    aria-labelledby="organization-title"
  >
    <div
      id="organization-content"
      class="modal-box w-[min(480px,calc(100vw-32px))] max-h-[calc(100dvh-32px)] border
        border-base-content/20 bg-base-200 p-0 scale-none translate-none
        motion-reduce:transition-none"
    ></div>
  </dialog>
  <p
    id="organization-status"
    class="sr-only"
    role="status"
  ></p>
{{ end }}
