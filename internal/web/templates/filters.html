{{ define "filters" }}
  <form
    id="filters"
    action="/"
    method="get"
    class="mb-5 flex flex-wrap items-end gap-3"
    hx-get="/inventory"
    hx-trigger="input changed delay:350ms from:#search, change from:#room, change from:#tag-filter, change from:#group-by"
    hx-target="#inventory"
    hx-swap="innerHTML"
    hx-sync="#inventory:replace"
  >
    <div class="flex grow flex-col gap-2 sm:max-w-sm">
      <label for="search">Search devices</label>
      <input
        class="input w-full"
        id="search"
        name="q"
        value="{{ .Query }}"
        placeholder="Name, address, tag, or note…"
      />
    </div>
    <div class="flex flex-col gap-2">
      <label for="room">Room</label>
      <select
        id="room"
        class="select w-44 data-[colored-label]:text-(--label-color)
          [&_option[data-colored-label]]:text-(--label-color)
          [&_option:not([data-colored-label])]:text-base-content"
        name="room"
      >
        {{ template "room-options" . }}
      </select>
    </div>
    {{ template "tag-filter" . }}
    <div class="flex flex-col gap-2">
      <label for="group-by">Group by</label>
      <select
        id="group-by"
        class="select w-32"
        name="group"
      >
        <option
          value=""
          {{ if not .GroupBy }}selected{{ end }}
        >
          None
        </option>
        <option
          value="room"
          {{ if eq .GroupBy "room" }}selected{{ end }}
        >
          Room
        </option>
      </select>
    </div>
    <label class="ml-auto flex items-center gap-2 py-3 text-sm text-base-content/65">
      <input
        id="auto-refresh"
        type="checkbox"
        class="checkbox checkbox-xs"
        checked
      />
      Auto-refresh (30s)
    </label>
    <button
      class="btn btn-ghost"
      type="submit"
      hx-get="/inventory?refresh=1"
      hx-trigger="click"
      hx-include="#filters"
      hx-target="#inventory"
      hx-swap="innerHTML"
    >
      Refresh
      <span
        class="loading loading-spinner loading-xs hidden in-[.htmx-request]:inline-block"
        aria-hidden="true"
      ></span>
    </button>
  </form>
{{ end }}

{{ define "room-options" }}
  <option value="">All rooms</option>
  {{ range .Rooms }}
    <option
      value="{{ . }}"
      {{ if eq . $.Room }}selected{{ end }}
    >
      {{ . }}
    </option>
  {{ end }}

{{ end }}

{{ define "tag-filter" }}
  <div
    id="tag-filter"
    class="group/tag-filter flex w-65 max-w-full min-w-0 flex-col gap-2 text-sm"
    data-tag-filter
  >
    <label for="filter-tags">
      Tags
      <span class="text-xs font-normal text-base-content/50">(any)</span>
    </label>
    <input
      type="hidden"
      name="tags"
      value="{{ range $index, $tag := .SelectedTags }}{{ if $index }},{{ end }}{{ $tag }}{{ end }}"
    />
    <div
      class="join w-full"
      data-filter-control
    >
      <button
        id="filter-tags"
        type="button"
        class="btn join-item min-w-0 flex-1 justify-start gap-2 border-base-content/20
          bg-base-100 px-3 text-sm font-normal group-data-[active]/tag-filter:border-info/50"
        aria-haspopup="dialog"
        aria-controls="filter-tag-suggestions"
        aria-expanded="false"
        data-filter-toggle
      >
        <span
          class="min-w-0 flex-1 truncate text-left data-[colored-label]:text-(--label-color)"
          data-filter-summary
        >
          {{ if eq (len .SelectedTags) 1 }}
            {{ index .SelectedTags 0 }}
          {{ else if .SelectedTags }}
            Selected tags
          {{ else }}
            All tags
          {{ end }}
        </span>
        <span
          class="badge badge-soft badge-info badge-sm"
          data-filter-count
          {{ if not .SelectedTags }}hidden{{ end }}
          aria-hidden="true"
        >
          {{ len .SelectedTags }}
        </span>
        <svg
          class="icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-square join-item border-base-content/20 bg-base-100 text-base-content/60
          group-data-[active]/tag-filter:border-info/50"
        aria-label="Clear tag filter"
        data-filter-clear
        {{ if not .SelectedTags }}hidden{{ end }}
      >
        <svg
          class="icon"
          aria-hidden="true"
        >
          <use href="#icon-close"></use>
        </svg>
      </button>
    </div>
    <div
      id="filter-tag-suggestions"
      class="card fixed z-[110] overflow-auto border border-base-content/20 bg-base-300
        shadow-xl"
      role="dialog"
      aria-label="Filter by tags"
      data-filter-menu
      hidden
    >
      <div class="shrink-0 px-3 pt-3 pb-2">
        <label
          for="filter-tag-search"
          class="sr-only"
        >
          Search tags
        </label>
        <input
          id="filter-tag-search"
          type="search"
          class="input w-full pointer-coarse:text-base"
          placeholder="Search tags…"
          autocomplete="off"
        />
        <p class="mt-2 text-xs text-base-content/60">Match any selected tag.</p>
      </div>
      <div
        class="min-h-10 overflow-y-auto overscroll-contain p-1"
        role="group"
        aria-label="Tags"
        data-filter-options
      ></div>
      <div class="flex shrink-0 justify-between border-t border-base-content/10 p-2">
        <button
          type="button"
          class="btn btn-ghost btn-sm pointer-coarse:min-h-10"
          data-filter-clear-all
        >
          Clear all
        </button>
        <button
          type="button"
          class="btn btn-ghost btn-sm pointer-coarse:min-h-10"
          data-filter-done
        >
          Done
        </button>
      </div>
    </div>
    <select
      id="tag-filter-options"
      data-picker-source
      hidden
      disabled
    >
      {{ template "tag-filter-options" . }}
    </select>
    <p
      class="sr-only"
      data-filter-status
      role="status"
    ></p>
  </div>
{{ end }}

{{ define "tag-filter-options" }}{{ range .Tags }}<option>{{ . }}</option>{{ end }}{{ end }}
