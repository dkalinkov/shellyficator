root = "."
tmp_dir = ".air"
env_files = []

[build]
cmd = "make dev-build"
entrypoint = ["./.air/shellyficator", "serve", "--http=127.0.0.1:8090", "--dir=./pb_data"]
include_ext = ["go", "html", "js", "mjs", "css", "sh"]
include_file = ["go.mod", "go.sum", "package.json", "package-lock.json", "Makefile", "VERSION", ".env", ".env.local"]
exclude_dir = [".air", ".git", "bin", "pb_data", "node_modules", "research", ".playwright-mcp", ".superdesign", "test-results", "vendor"]
# Generated by the UI build; watching these would cause a rebuild loop.
exclude_file = ["internal/web/static/app.css", "internal/web/static/htmx.min.js"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = false
delay = 400
stop_on_error = false
send_interrupt = true
kill_delay = "2s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false

[proxy]
enabled = false
