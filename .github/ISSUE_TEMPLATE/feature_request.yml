name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/dkalinkov/shellyficator/blob/main/docs/wiki/roadmap.md)
        first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
