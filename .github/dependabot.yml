version: 2

# Weekly grouped updates. The cooldown skips versions published in the last
# week, which gives the ecosystem time to catch compromised releases.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    # 4.3.5 drops daisyUI's .join focus and hover rules ("Invalid empty selector").
    ignore:
      - dependency-name: "tailwindcss"
        versions: ["4.3.5"]
      - dependency-name: "@tailwindcss/cli"
        versions: ["4.3.5"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
