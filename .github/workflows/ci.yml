name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.x"
  GOTOOLCHAIN: local
  NODE_VERSION: "26"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build web assets
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Check vendored assets match package-lock.json
        run: git diff --exit-code -- internal/web/static

      - name: Check template formatting
        run: npm run check:templates

      - name: Check Go formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github
          advanced-security: false

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: shellyficator:ci

      - name: Smoke test
        run: |
          docker run --rm shellyficator:ci --version
          docker run -d --name smoke -p 127.0.0.1:8090:8090 shellyficator:ci
          if ! curl -fsS --retry 15 --retry-delay 1 --retry-all-errors http://127.0.0.1:8090/healthz; then
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke

      - name: Build for linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64

      - name: Build the Home Assistant image for linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: homeassistant
          platforms: linux/amd64
          load: true
          tags: shellyficator-ha:ci

      # Runs the image the way Home Assistant does: on Home Assistant's internal
      # address, /data owned by root with an options.json inside, and Docker's
      # init process. Requests from the runner must be refused.
      - name: Smoke test the Home Assistant image
        run: |
          data=$(mktemp -d)
          docker run --rm --entrypoint sh -v "$data:/data" shellyficator-ha:ci -c '
            chown 0:0 /data
            echo "{\"device_password\":\"\"}" > /data/options.json
            chmod 600 /data/options.json
            ln -s /usr/local/bin/shellyficator /data/link-to-binary'
          docker network create --subnet 172.30.32.0/23 --gateway 172.30.33.254 hassio
          docker run -d --init --name ha-smoke --network hassio --ip 172.30.32.1 \
            -p 127.0.0.1:8091:8090 -v "$data:/data" shellyficator-ha:ci
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 15 --retry-delay 1 --retry-all-errors http://127.0.0.1:8091/healthz || true)
          if [ "$status" != 403 ]; then
            echo "Expected 403 from outside Home Assistant, got $status"
            docker logs ha-smoke
            exit 1
          fi
          # Home Assistant shows the app as started only once it is healthy.
          for _ in $(seq 1 15); do
            health=$(docker inspect -f '{{.State.Health.Status}}' ha-smoke)
            if [ "$health" = healthy ]; then break; fi
            sleep 1
          done
          if [ "$health" != healthy ]; then
            echo "Expected a healthy container, got $health"
            exit 1
          fi
          docker exec ha-smoke sh -euc '
            pid=$(pidof shellyficator)
            test "$(awk "/^Uid:/ {print \$2}" "/proc/$pid/status")" = 10001
            test -z "$(find /data ! -user shellyficator)"
            test "$(stat -c %u /usr/local/bin/shellyficator)" = 0'
          docker rm -f ha-smoke
          docker network rm hassio

      - name: Build the Home Assistant image for linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: homeassistant
          platforms: linux/arm64

  release-config:
    name: Release dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same setup as the release job, without dependency caches.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Check CHANGELOG.md has a section for VERSION
        run: scripts/release-notes.sh "$(cat VERSION)" > /dev/null

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean

  # Home Assistant offers an update as soon as the app's version changes, so
  # that version's image must already be published. See docs/wiki/home-assistant.md.
  homeassistant:
    name: Home Assistant app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the app version is published
        run: |
          app=homeassistant/shellyficator
          version=$(yq -r .version "$app/config.yaml")
          image=$(yq -r .image "$app/config.yaml")
          scripts/release-notes.sh "$version" "$app/CHANGELOG.md" > /dev/null
          # No registry login, so this also confirms anyone can pull the image.
          if ! manifest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}'); then
            echo "::error::$image:$version is not published or not public. Bump the app version only after the release is out."
            exit 1
          fi
          platforms=$(jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | join(" ")' <<< "$manifest")
          for arch in $(yq -r '.arch[]' "$app/config.yaml"); do
            case "$arch" in
              amd64) platform=linux/amd64 ;;
              aarch64) platform=linux/arm64 ;;
              *) echo "::error::Unsupported app architecture $arch"; exit 1 ;;
            esac
            if [[ " $platforms " != *" $platform "* ]]; then
              echo "::error::$image:$version has no $platform image for the $arch app architecture"
              exit 1
            fi
          done
          echo "$image:$version is published for $platforms"

  # Single required status check for the main branch ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, workflows, image, release-config, homeassistant]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  edge:
    name: Publish edge image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: edge-image
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # Sigstore certificate for attestations
      attestations: write # store build provenance
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read build metadata
        id: build
        run: |
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: type=edge,branch=main

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_TYPE=dev
            BUILD_COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
