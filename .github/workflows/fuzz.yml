name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  GOTOOLCHAIN: local

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Fuzz
        run: scripts/fuzz.sh 3m

      # Add a printed input under the same path to keep it as a regression test.
      - name: Show failing inputs
        if: failure()
        run: |
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while read -r file; do
            echo "== $file"
            cat "$file"
          done
